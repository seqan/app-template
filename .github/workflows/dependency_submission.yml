# Submits the CPM packages (cmake/package-lock.cmake) and the CPM version (cmake/CPM.cmake) of every change on main to
# the dependency graph, e.g. when the PR of ci_cpm.yml is merged.
# Problems (e.g. a disabled dependency graph) are warnings, not failures.
# Only for the template itself: initialise.yml removes this workflow from new repositories, and the repository check
# keeps it from submitting the template's package lock on their first push.

name: Dependency Submission

on:
  push:
    branches:
      - 'main'
    paths:
      - 'cmake/package-lock.cmake'
      - 'cmake/CPM.cmake'
  workflow_dispatch:

# Only the latest snapshot counts: a newer push cancels an older submission that has not finished.
concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    name: Dependency Submission
    runs-on: ubuntu-latest
    if: github.repository == 'seqan/app-template' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    permissions:
      contents: write # dependency submission API
    steps:
      - name: Submit CPM dependencies
        uses: seqan/actions/cpm_dependency_submission@main
        with:
          package_lock_file: cmake/package-lock.cmake
